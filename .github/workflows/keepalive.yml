name: supabase-keepalive

# 1. Pings the app's /api/health route on a schedule so the free-tier Supabase
#    project keeps registering activity and does not auto-pause (7 idle days).
# 2. Re-enables this workflow and roadmap-snapshot every run. The repo is
#    public, and GitHub auto-disables scheduled workflows on public repos after
#    60 days without repository activity; calling the "enable workflow" API
#    resets that clock. (Going private instead was tried on 2026-11-16: Vercel's
#    Hobby plan then blocks deploys whose commit author isn't the linked account.)
on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  actions: write # only for the enable calls below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            https://roadmapper-orpin.vercel.app/api/health)
          echo "HTTP $code"
          cat /tmp/body
          test "$code" = "200"

      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml snapshot.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
